            flex-direction: column;

            display: flex;
            align-items: center;

    <script>

            const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
            const isAndroid = /Android/.test(ua);
            
            // App Store URLs
            const iosUrl = 'https://apps.apple.com/ua/app/id6760315933';
            const androidUrl = 'https://play.google.com/store/apps/details?id=com.gusaklab.puzzlescroll';
            
            // Auto-redirect on mobile
            if (isIOS) {
                window.location.href = iosUrl;
            } else if (isAndroid) {
                window.location.href = androidUrl;
            }
            // Desktop users see the landing page
        })();
    </script>

</html>
